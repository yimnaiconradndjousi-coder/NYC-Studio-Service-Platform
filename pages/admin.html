<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin page</title>
    <link rel="stylesheet" href="../styles/admin.css">
    <link rel="shortcut icon" href="../favicon.svg" type="image/x-icon">
    <script src="../scripts/main.js" defer></script>
</head>
<body>

    <section id="admin-panel">
        <div class="sidebar">
            <div class="admin-user">
                <div><img class="user-image" src="../icons/bot.webp" alt="admin user picture"></div>

                <div class="admin-info">
                    <span id="sidebar-username" class="userName">Yimnai conrad</span>
                    <p>Administrator</p>
                </div>
            </div>

            <!-- Sidebar Navigation -->
            <div class="sidebar-nav">
                <p>Advailable Options</p>
                <div class="sidebar-nav-container">

                    <div class="sidebar-link" id="service-sidebar">
                        <img class="sibebar-icon" src="/icons/dashboard.png" alt="dashboard icon">
                        <p>Service</p>
                    </div>

                    <div class="sidebar-link" id="user-sidebar">
                        <img class="sibebar-icon" src="/icons/user.png" alt="users icon">
                        <p>User</p>
                    </div>

                </div>
            </div>
        </div>

        <!-- Dashboard Navbar -->
        <div class="dashboard-navbar">
            <div class="navbar">

                <div class="navbar-left">
                    <span>Dashboard</span>
                </div>

                <div class="navbar-right">
                    <img class="nav-icon" src="../icons/notification.png" alt="notification icon">
                </div>

            </div>

            <!-- Main windows view for dynamic content -->
            <div class="main-page-view" id="service-view">

                <div class="main-view-analytics" id="view-analytics">

                    <!-- view card left -->
                    <div class="view-card" id="view-card-left">

                        <div class="card-section">
                            <div class="welcome-msg">
                                <p>Welcome</p>
                                <span class="userName">Yimnai conrad</span>
                            </div>
                            
                            <div>
                                <p>Number of <span id="number-service-or-user">services</span>: </p>
                            </div>
                        </div>

                        <div class="card-section-2">
                            <p id="number-services">5</p>
                        </div>

                    </div>

                    <!-- view card left -->
                    <div class="view-card" id="view-card-right">

                        <div class="card-section">
                            <p>Connection time</p>
                            <p>Last time connected: </p>
                        </div>

                        <div class="card-section-2">
                            <p id="last-time-connected">Yesterday</p>
                        </div>
                    </div>
                    
                </div>

                <!-- Forms -->

                <!-- Add serivce form for dynamic content -->
                <div class="add-form">

                    <!-- Close form button -->
                    <img class="close-btn"src="../icons/close-white.png" alt="close icon">

                    <form>
                        <!-- Name -->
                        <label for="title" class="name-label">Service Name</label>
                        <input type="text" name="title" id="service-title" placeholder="Type the name of the E-service here">
                        <hr>

                        <!-- Description -->
                        <label for="description" class="description-label">Service Description</label>
                        <textarea name="description" id="service-description" placeholder="Enter the E-service description here..."></textarea>
                        <hr>

                        <!-- Add button -->
                        <button class="add-btn" id="form-add-btn">Add Service</button>
                    </form>
                </div>

                <!-- Modify serivce form for dynamic content -->
                <div id="modify-form-container">

                    <!-- Close form button -->
                    <img class="close-btn"src="../icons/close-white.png" alt="">

                    <form id="modification-form" action="">
                        <!-- Name --> 
                        <label for="title">Service Name</label>
                        <textarea name="title" id="modify-service-title" placeholder="Type the name of the E-service here"></textarea>
                        <hr>

                        <!-- Description -->
                        <label for="description">Service Description</label>
                        <textarea name="description" id="modify-service-description" placeholder="Enter the E-service description here..."></textarea>
                        <hr>

                        <!-- action -->
                        <div class="modification-buttons">
                            <button id="apply-changes-btn">Apply</button>
                            <button id="discard-changes-btn">Discard</button>
                        </div>

                    </form>
                </div>

                <div class="table-section">
                    <div id="table-container">
                        <table>
                            <!-- Table Caption or Title -->
                            <caption>
                                <div class="caption-container">
                                    <div id="caption-title">Services</div>
                                    <div>
                                        <!-- Add service modal form summoner -->
                                        <button id="table-add-btn">
                                            <div class="add-service-btn-container">
                                                <img class="plus-icon" src="../icons/plus.png" alt=""> 
                                                <p>Add Service</p>
                                            </div>
                                        </button>
                                    </div>
                                </div>
                            </caption>

                            <!-- Table Header -->
                            <thead>
                                <tr>
                                    <th>Name</th>
                                    <th id="role-or-description">Description</th>
                                    <th>Action</th>
                                </tr>
                            </thead>

                            <!-- Table Data or Entries -->
                            <tbody id="table-data">
                            </tbody>

                        </table>
                    </div>     
                </div>

            </div>

        </div>

    </section>
</body>
</html>

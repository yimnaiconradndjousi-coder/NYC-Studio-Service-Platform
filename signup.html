<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="./styles/login.css">
    <script src="./scripts/main.js" defer></script>

</head>
<body>
    <div class="login-form">
        <form action="">
            <div class="form-title">
                <h1>Login</h1>
            </div>
            
            <div class="input-field">
                <label for="username">Username</label>
                <div class="input-and-logo">
                    <img src="./icons/user icon.png" class="input-icon" alt="user logo">
                    <input type="text" name="username" id="username" placeholder="Type your username" autocomplete="username">
                </div>
                <hr class="hr1">
            </div>
            <p class="username-error"></p>
            

            <div class="input-field">
                <label for="password">Password</label>
                <div class="input-and-logo">
                    <img src="./icons/lock icon.png" class="input-icon" alt="lock icon">
                    <input type="password" name="password" id="password" placeholder="Type your password" autocomplete="current-password">
                    <img src="./icons/hide-password.png" id="show-or-hide-password" alt="eye icon">
                </div>

                <hr class="hr2">
            </div>
            <p id="password-error"></p>
            

            <a href="#" class="forgot-password-link">Forgot password?</a>

            <button class="login-btn">LOGIN</button>

            <p>Or Sign Up Using</p>
            <div class="sign-up">
                <div class="signup-option">
                    <a href="#"><img class="socail-media-icons" src="./icons/facebook.webp" alt="facebook logo"></a>
                    <a href="#"><img class="socail-media-icons" src="./icons/linkedin.png" alt="linkedin logo"></a>
                    <a href="#"><img class="socail-media-icons" src="./icons/google.png" alt="google logo"></a>
                </div>
            </div>

            <p>Or Sign Up Using</p>
            <a href="#" class="external-link">SIGN UP</a>

        </form>

    </div>
</body>
</html>
